# MEP-Agents stack: redis, postgres(pgvector), api, worker, streamlit, web
# Phase C adds postgres service. Usage: cp .env.example .env && docker compose up --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mep_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mep_agents}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mep} -d ${POSTGRES_DB:-mep_agents}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8083"]
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mep:mep_secret@postgres:5432/mep_agents}
      USE_PGVECTOR: ${USE_PGVECTOR:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - boq_data:/app/data/boq
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "src.celery_app", "worker", "-l", "info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
      DATABASE_URL: ${DATABASE_URL:-postgresql://mep:mep_secret@postgres:5432/mep_agents}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - boq_data:/app/data/boq

  streamlit:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
      DATABASE_URL: ${DATABASE_URL:-postgresql://mep:mep_secret@postgres:5432/mep_agents}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8083}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  redis_data:
  postgres_data:
  uploads_data:
  boq_data:
