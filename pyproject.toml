[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "celery>=5.6.3",
    "coolprop>=8.0.0",
    "ezdxf>=1.4.4",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "fastexcel>=0.20.2",
    "ifcopenshell>=0.8.5",
    "langchain-anthropic>=1.5.4",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numba>=0.66.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "polars>=1.43.2",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pywin32>=312; sys_platform == 'win32'",
    "rapidfuzz>=3.14.5",
    "redis<5.0.0",
    "rtree>=1.4.1",
    "streamlit>=1.61.1",
    "tiktoken>=0.13.0",
    "ultralytics>=8.4.117",
    "uvicorn>=0.52.1",
    "xlsxwriter>=3.2.9",
]

[project.optional-dependencies]
# OCR cho hồ sơ scan. Cố ý KHÔNG nằm ở nhóm chính: cài đặt máy chủ tối thiểu vẫn phải chạy
# được, và `src/ocr_tools.py` khi thiếu engine thì trả về hướng dẫn cài chứ không sập.
# Cần thêm gói hệ thống: tesseract-ocr, tesseract-ocr-vie, poppler-utils.
ocr = [
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
]
phase-c = [
    "boto3>=1.35.0",
    "PyJWT>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "langchain-postgres>=0.0.12",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
