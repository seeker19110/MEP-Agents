# Đóng gói đủ 4 thành phần của hệ thống (xem TECH_DEBT.md mục 3) — trước đây repo chỉ có
# 1 Dockerfile đóng gói riêng Streamlit app (`app.py`), không có FastAPI/Celery/Redis/Web
# React nào được container hóa, nên "đã có Docker" là hiểu nhầm.
#
# LƯU Ý TRUNG THỰC: file này được viết và kiểm tra cú pháp bằng `docker compose config`,
# nhưng CHƯA từng chạy thật bằng `docker compose up` trong môi trường phát triển hiện tại
# (không có Docker daemon khả dụng ở đây) — trước khi coi mục 3 trong TECH_DEBT.md là "đã
# xong", cần người có Docker daemon thật chạy thử `docker compose up --build` và xác nhận
# cả 4 service lên đúng + Web App gọi được BOQ thật qua Worker.
#
# Sử dụng: `cp .env.example .env` (điền API key LLM thật), `cp web/.env.example web/.env`
# (đặt VITE_API_BASE=http://localhost:8083 nếu chạy local), rồi `docker compose up --build`.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Cloud API (src/api.py) — nhận upload từ Web App + plugin Revit/AutoCAD, đẩy
  # việc nặng (bóc khối lượng CAD) vào hàng đợi Celery thay vì xử lý đồng bộ trong request.
  api:
    build: .
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8083"]
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      # "redis" ở đây là TÊN SERVICE bên dưới (Docker Compose tự phân giải DNS nội bộ),
      # không phải "localhost" như khi chạy trực tiếp trên máy dev (xem src/celery_app.py).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
      # Đổi domain Web App thật khi deploy — không dùng "*" (xem TECH_DEBT.md mục 7).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - boq_data:/app/data/boq
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Worker Celery — xử lý bóc khối lượng CAD nặng ngoài tiến trình FastAPI (src/celery_app.py).
  worker:
    build: .
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "src.celery_app", "worker", "-l", "info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - boq_data:/app/data/boq

  # Streamlit UI (app.py) — giao diện chat multi-agent gốc của dự án, độc lập với luồng
  # Web App React + FastAPI (2 giao diện khác nhau cho cùng backend Python).
  streamlit:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  # Web App React/Vite (web/) — build tĩnh, phục vụ qua Nginx. Biến VITE_* được nạp lúc
  # BUILD (Vite bake vào bundle JS), không đổi được lúc chạy container — đổi thì phải build
  # lại image (xem web/Dockerfile).
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8083}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  redis_data:
  uploads_data:
  boq_data:
